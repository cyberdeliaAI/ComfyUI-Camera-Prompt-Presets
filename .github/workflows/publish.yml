name: Publish to Comfy Registry

# Deliberately manual-only until the private project is ready for public release.
# Requires a REGISTRY_ACCESS_TOKEN secret owned by publisher cyberdelia.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'cyberdelia' || github.repository_owner == 'cyberdeliaAI' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
